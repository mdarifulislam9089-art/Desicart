<!DOCTYPE html>
<html lang="bn">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>আমার অনলাইন শপ - Blogger Connected E-commerce</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Hind+Siliguri:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: 'Hind Siliguri', sans-serif;
        }
    </style>
</head>
<body class="bg-gray-50 text-gray-800">

    <!-- Header / Navbar -->
    <header class="bg-white shadow-sticky sticky top-0 z-50 shadow-sm">
        <div class="container mx-auto px-4 py-4 flex justify-between items-center">
            <a href="#" class="text-2xl font-bold text-indigo-600">🛍️ আমার শপ</a>
            <div class="flex items-center space-x-4">
                <a href="https://wa.me/8801700000000" target="_blank" class="bg-green-500 hover:bg-green-600 text-white px-4 py-2 rounded-full font-medium text-sm flex items-center gap-2">
                    💬 WhatsApp হেল্প
                </a>
            </div>
        </div>
    </header>

    <!-- Hero Section -->
    <section class="bg-indigo-600 text-white py-12 px-4 text-center">
        <div class="container mx-auto max-w-2xl">
            <h1 class="text-3xl md:text-4xl font-bold mb-4">সেরা মূল্যে সেরা পণ্য কিনুন</h1>
            <p class="text-indigo-100 mb-6">আপনার পছন্দের পণ্য সিলেক্ট করুন এবং সরাসরি WhatsApp-এ অর্ডার করুন।</p>
            <div class="relative max-w-md mx-auto">
                <input type="text" id="searchBox" placeholder="পণ্য খুঁজুন..." class="w-full px-4 py-3 rounded-full text-gray-800 focus:outline-none shadow-md">
            </div>
        </div>
    </section>

    <!-- Main Content -->
    <main class="container mx-auto px-4 py-10">
        
        <!-- Category Filter Buttons -->
        <div class="flex flex-wrap justify-center gap-2 mb-8" id="categoryFilters">
            <button onclick="filterProducts('all')" class="category-btn bg-indigo-600 text-white px-4 py-2 rounded-full text-sm font-medium transition">সব পণ্য</button>
            <button onclick="filterProducts('Electronics')" class="category-btn bg-white text-gray-700 border border-gray-300 px-4 py-2 rounded-full text-sm font-medium hover:bg-gray-100 transition">ইলেকট্রনিক্স</button>
            <button onclick="filterProducts('Clothing')" class="category-btn bg-white text-gray-700 border border-gray-300 px-4 py-2 rounded-full text-sm font-medium hover:bg-gray-100 transition">পোশাক</button>
        </div>

        <!-- Product Grid -->
        <div id="productGrid" class="grid grid-cols-1 sm:grid-cols-2 md:grid-cols-3 lg:grid-cols-4 gap-6">
            <!-- Products will be loaded here dynamically via JavaScript -->
        </div>
    </main>

    <!-- Footer -->
    <footer class="bg-gray-800 text-white py-6 text-center mt-12">
        <p>&copy; ২০২৬ আমার শপ। সর্বস্বত্ব সংরক্ষিত। Blogger-এর মাধ্যমে চালিত।</p>
    </footer>

    <!-- JavaScript for Dynamic Products & WhatsApp Order -->
    <script>
        // স্যাম্পল প্রোডাক্ট ডেটা (ভবিষ্যতে এটি Blogger RSS Feed বা API দিয়ে পরিবর্তন করা যাবে)
        const products = [
            {
                id: 1,
                title: "স্মার্ট ওয়াচ সিরিজ এক্স",
                price: "১,৫০০ টাকা",
                category: "Electronics",
                image: "https://images.unsplash.com/photo-1523275335684-37898b6baf30?auto=format&fit=crop&w=500&q=80",
                description: "হাই কোয়ালিটি স্মার্ট ওয়াচ, ব্লুটুথ কলিং এবং ফিটনেস ট্র্যাকার।"
            },
            {
                id: 2,
                title: "স্টাইলিশ জেন্টস হুডি",
                price: "১,২০০ টাকা",
                category: "Clothing",
                image: "https://images.unsplash.com/photo-1556905055-8f358a7a47b2?auto=format&fit=crop&w=500&q=80",
                description: "শীতের জন্য আরামদায়ক ও প্রিমিয়াম কটন হুডি।"
            },
            {
                id: 3,
                title: "ওয়্যারলেস ব্লুটুথ ইয়ারবাডস",
                price: "৯৯০ টাকা",
                category: "Electronics",
                image: "https://images.unsplash.com/photo-1590658268037-6bf12165a8df?auto=format&fit=crop&w=500&q=80",
                description: "দীর্ঘস্থায়ী ব্যাটারি ব্যাকআপ এবং ক্লিয়ার সাউন্ড কোয়ালিটি।"
            },
            {
                id: 4,
                title: "কটন ক্যাজুয়াল শার্ট",
                price: "৮৫০ টাকা",
                category: "Clothing",
                image: "https://images.unsplash.com/photo-1602810318383-e386cc2a3ccf?auto=format&fit=crop&w=500&q=80",
                description: "আরামদায়ক সুতি কাপড়ের প্রিমিয়াম ক্যাজুয়াল শার্ট।"
            }
        ];

        const productGrid = document.getElementById('productGrid');
        const searchBox = document.getElementById('searchBox');

        // প্রোডাক্ট রেন্ডার করার ফাংশন
        function displayProducts(productsToDisplay) {
            productGrid.innerHTML = '';
            if (productsToDisplay.length === 0) {
                productGrid.innerHTML = `<p class="col-span-full text-center text-gray-500 py-10">কোনো পণ্য পাওয়া যায়নি!</p>`;
                return;
            }

            productsToDisplay.forEach(product => {
                // WhatsApp অর্ডার মেসেজ তৈরি
                const whatsappNumber = "8801700000000"; // আপনার WhatsApp নম্বর দিন
                const message = `হ্যালো, আমি এই পণ্যটি অর্ডার করতে চাই:

*${product.title}*
দাম: ${product.price}
ছবি: ${product.image}`;
                const whatsappUrl = `https://wa.me/${whatsappNumber}?text=` + encodeURIComponent(message);

                const productCard = `
                    <div class="bg-white rounded-xl shadow-md overflow-hidden hover:shadow-lg transition flex flex-col justify-between">
                        <div>
                            <img src="${product.image}" alt="${product.title}" class="w-full h-48 object-cover">
                            <div class="p-4">
                                <span class="text-xs bg-indigo-50 text-indigo-600 px-2 py-1 rounded-full font-medium">${product.category}</span>
                                <h3 class="font-bold text-lg mt-2 mb-1">${product.title}</h3>
                                <p class="text-gray-600 text-sm mb-3">${product.description}</p>
                            </div>
                        </div>
                        <div class="p-4 pt-0 flex items-center justify-between border-t border-gray-100 mt-2">
                            <span class="text-indigo-600 font-bold text-lg">${product.price}</span>
                            <a href="${whatsappUrl}" target="_blank" class="bg-green-600 hover:bg-green-700 text-white px-3 py-2 rounded-lg text-sm font-medium flex items-center gap-1 transition">
                                অর্ডার করুন
                            </a>
                        </div>
                    </div>
                `;
                productGrid.innerHTML += productCard;
            });
        }

        // ক্যাটাগরি ফিল্টার ফাংশন
        function filterProducts(category) {
            document.querySelectorAll('.category-btn').forEach(btn => {
                btn.classList.remove('bg-indigo-600', 'text-white');
                btn.classList.add('bg-white', 'text-gray-700', 'border', 'border-gray-300');
            });
            event.target.classList.remove('bg-white', 'text-gray-700', 'border', 'border-gray-300');
            event.target.classList.add('bg-indigo-600', 'text-white');

            if (category === 'all') {
                displayProducts(products);
            } else {
                const filtered = products.filter(p => p.category === category);
                display_products(filtered);
            }
        }

        // সার্চ ফাংশনালিটি
        searchBox.addEventListener('input', (e) => {
            const query = e.target.value.toLowerCase();
            const filtered = products.filter(p => p.title.toLowerCase().includes(query) || p.description.toLowerCase().includes(query));
            displayProducts(filtered);
        });

        displayProducts(products);
    </script>
</body>
</html>
